<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deck AI · Biblioteca Jump</title><style>:root{--ink:#171717;--paper:#f1f0eb;--card:#fbfbf8;--acid:#d7ff45;--muted:#77766f;--line:#d8d7d0;--red:#a34539}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Arial,sans-serif}.page{max-width:1100px;margin:auto;padding:34px}.top{border-bottom:1px solid var(--ink);padding-bottom:20px;margin-bottom:20px}.kicker{text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-size:10px}h1{font-size:40px;letter-spacing:-.07em;margin:8px 0}.tools{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}input,select,textarea{font:inherit;padding:11px;border:1px solid var(--line);background:#fff}input{flex:1}.btn{border:1px solid var(--ink);background:var(--ink);color:var(--acid);padding:10px 13px;cursor:pointer}.card{background:var(--card);border:1px solid var(--line);padding:19px;margin-bottom:16px}.item{display:grid;grid-template-columns:1fr auto;gap:14px;border-top:1px solid var(--line);padding:17px 0}.item:first-child{border-top:0}.title{font-weight:700}.meta,.source{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.5}.badge{font-size:10px;text-transform:uppercase;padding:5px 7px;border:1px solid var(--ink);height:max-content}.approved{background:var(--acid)}.in_review{background:#fff0ca}.draft{background:#e4e1ff}.rejected,.expired{color:var(--red);border-color:var(--red)}.archived{background:#deded8;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.empty{text-align:center;color:var(--muted);padding:30px;border:1px dashed var(--line)}button{font:inherit;cursor:pointer}@media(max-width:700px){.page{padding:20px}.item{display:block}.actions{justify-content:flex-start;margin-top:12px}}
</style></head><body><main class="page"><header class="top"><div class="kicker">Deck AI · Dev 3 · governança de conteúdo</div><h1>Biblioteca Jump</h1><div class="meta">Conteúdo aprovado precisa ter fonte e validade antes de chegar à IA.</div></header><div class="tools"><input id="query" placeholder="Buscar título, texto ou tag..." oninput="render()"><select id="filter" onchange="render()"><option value="all">Todos os status</option><option>draft</option><option>in_review</option><option>approved</option><option>rejected</option><option>archived</option></select><button class="btn" onclick="seedPublic()">Carregar conteúdo público de exemplo</button></div><section class="card"><div id="list"></div></section></main><script>const KEY='deckai.prototype.jump';let data=[];const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}};const write=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){data=read();const q=document.getElementById('query').value.toLowerCase(),f=document.getElementById('filter').value;const items=data.filter(x=>(f==='all'||x.status===f)&&(!q||`${x.title} ${x.body} ${(x.tags||[]).join(' ')}`.toLowerCase().includes(q)));document.getElementById('list').innerHTML=items.length?items.map(x=>`<article class="item"><div><div class="title">${esc(x.title)}</div><div class="meta">Categoria: ${esc(x.category)} · Criado por: ${esc(x.createdBy||'local-user')}</div><div class="source">Fonte: <a href="${esc(x.source?.url||x.source||'#')}" target="_blank">${esc(x.source?.url||x.source||'não informada')}</a><br>Validade: ${esc(x.validUntil||'não definida')}</div><p>${esc(x.body)}</p></div><div><span class="badge ${x.status}">${esc(x.status)}</span><div class="actions">${x.status==='draft'?`<button onclick="transition('${x.contentId}','in_review')">Enviar para revisão</button>`:''}${x.status==='in_review'?`<button class="btn" onclick="approve('${x.contentId}')">Aprovar</button><button onclick="transition('${x.contentId}','rejected')">Rejeitar</button>`:''}${x.status==='approved'?`<button onclick="transition('${x.contentId}','archived')">Arquivar</button>`:''}${x.status==='archived'?`<button onclick="transition('${x.contentId}','draft')">Restaurar</button>`:''}</div></div></article>`).join(''):'<div class="empty">Nenhum conteúdo encontrado.</div>'}function transition(id,status){const x=data.find(i=>i.contentId===id);if(!x)return;x.status=status;x.updatedAt=new Date().toISOString();write();render()}function approve(id){const x=data.find(i=>i.contentId===id);if(!x)return;x.status='approved';x.validFrom=new Date().toISOString().slice(0,10);x.validUntil='2027-12-31';x.approvedBy='local-reviewer';x.approvedAt=new Date().toISOString();write();render()}function seedPublic(){const items=[{contentId:'public_demo_1',title:'Sobre a Jump',category:'historia',body:'A Jump atua com tecnologia, dados, inteligência artificial e nuvem.',source:{url:'https://jump.tec.br/sobre-nos/'},status:'in_review',validUntil:null,tags:['institucional']},{contentId:'public_demo_2',title:'Indicadores institucionais',category:'numeros',body:'Conteúdo público aguardando confirmação interna.',source:{url:'https://jump.tec.br/sobre-nos/'},status:'in_review',validUntil:null,tags:['numeros']}];write(items);render()}render();</script></body></html>
