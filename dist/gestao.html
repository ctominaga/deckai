<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deck AI · Gestão</title><style>:root{--ink:#171717;--paper:#f1f0eb;--card:#fbfbf8;--acid:#d7ff45;--muted:#77766f;--line:#d8d7d0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Arial,sans-serif}.page{max-width:1050px;margin:auto;padding:34px}.top{border-bottom:1px solid var(--ink);padding-bottom:20px;margin-bottom:20px}.kicker{text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-size:10px}h1{font-size:40px;letter-spacing:-.07em;margin:8px 0}.tools{display:flex;gap:8px;margin-bottom:18px}input,select{font:inherit;padding:11px;border:1px solid var(--line);background:#fff}input{flex:1}.list{display:grid;gap:10px}.item{background:var(--card);border:1px solid var(--line);padding:17px;display:flex;justify-content:space-between;gap:14px;align-items:center}.title{font-weight:700}.meta{color:var(--muted);font-size:12px;margin-top:5px}.badge{font-size:10px;text-transform:uppercase;padding:5px 7px;border:1px solid var(--ink)}.draft{background:#fff0ca}.archived{background:#deded8;color:var(--muted)}button{border:1px solid var(--ink);background:transparent;padding:8px 10px;cursor:pointer}.primary{background:var(--ink);color:var(--acid)}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line)}@media(max-width:700px){.page{padding:20px}.item{display:block}.actions{margin-top:12px}.tools{flex-wrap:wrap}}</style></head><body><main class="page"><header class="top"><div class="kicker">Deck AI · plataforma local</div><h1>Gestão de apresentações</h1><div class="meta">Rascunhos podem ser excluídos. Apresentações arquivadas permanecem no histórico.</div></header><div class="tools"><input id="query" placeholder="Buscar por título..." oninput="render()"><select id="filter" onchange="render()"><option value="all">Todas</option><option value="draft">Rascunhos</option><option value="archived">Arquivadas</option></select><button class="primary" onclick="window.location.href='prototipo.html'">Nova apresentação</button></div><section id="list" class="list"></section></main><script>const KEY='deckai.prototype.presentations';let data=[];const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}};const write=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){data=read();const q=document.getElementById('query').value.toLowerCase(),f=document.getElementById('filter').value;const items=data.filter(p=>(!q||p.title.toLowerCase().includes(q))&&(f==='all'||p.status===f));document.getElementById('list').innerHTML=items.length?items.map(p=>`<article class="item"><div><div class="title">${esc(p.title)}</div><div class="meta">${p.versions.length} versão(ões) · ${p.status||'draft'}</div></div><div class="actions"><span class="badge ${p.status||'draft'}">${p.status||'draft'}</span><button onclick="openEditor('${p.presentationId}')">Editar</button>${p.status==='archived'?`<button onclick="restore('${p.presentationId}')">Restaurar</button>`:`<button onclick="archive('${p.presentationId}')">Arquivar</button>`}${(p.status||'draft')==='draft'?`<button onclick="removeDraft('${p.presentationId}')">Excluir rascunho</button>`:''}</div></article>`).join(''):'<div class="empty">Nenhuma apresentação encontrada.</div>'}function openEditor(id){localStorage.setItem('deckai.selectedPresentation',id);window.location.href='editor.html'}function archive(id){const p=data.find(x=>x.presentationId===id);if(!p)return;p.status='archived';write();render()}function restore(id){const p=data.find(x=>x.presentationId===id);if(!p)return;p.status='draft';write();render()}function removeDraft(id){const p=data.find(x=>x.presentationId===id);if(!p||p.status!=='draft')return;if(confirm('Excluir este rascunho?')){data=data.filter(x=>x.presentationId!==id);write();render()}}render();</script></body></html>
