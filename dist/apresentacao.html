<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deck AI · Apresentação</title>
<style>
:root{--ink:#171717;--paper:#f1f0eb;--card:#fbfbf8;--acid:#d7ff45;--muted:#77766f;--line:#d8d7d0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Arial,sans-serif}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{background:#171717;color:#f4f2eb;padding:26px 20px}.brand{font-size:24px;font-weight:700;letter-spacing:-.08em;margin-bottom:38px}.brand span{color:var(--acid)}.kicker{text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-size:10px}.side .kicker{color:#96958c}.presentation-list{margin-top:15px;display:grid;gap:4px}.presentation-list button{background:transparent;color:#b7b5ab;border:0;text-align:left;padding:12px 9px;cursor:pointer;border-left:2px solid transparent}.presentation-list button:hover,.presentation-list button.active{background:#292927;color:#fff;border-left-color:var(--acid)}.empty{color:#aaa;font-size:12px;line-height:1.5;padding:10px 0}.main{padding:34px 42px;max-width:1200px;width:100%}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:22px;margin-bottom:22px}.title{font-size:38px;letter-spacing:-.07em;margin:7px 0 0}.meta{text-align:right;color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.btn{border:1px solid var(--ink);background:var(--ink);color:var(--acid);padding:10px 13px;cursor:pointer}.outline{background:transparent;color:var(--ink)}.stage{display:grid;grid-template-columns:180px 1fr;gap:18px}.thumbs{display:grid;align-content:start;gap:8px}.thumb{border:1px solid var(--line);background:var(--card);padding:10px;text-align:left;min-height:80px;cursor:pointer}.thumb.active{border:2px solid var(--ink);background:var(--acid)}.thumb-number{font-size:10px;color:var(--muted)}.thumb-title{font-size:12px;font-weight:700;margin-top:6px}.slide{background:var(--card);border:1px solid var(--line);aspect-ratio:16/9;padding:7%;display:flex;flex-direction:column;justify-content:center;min-height:420px}.slide.layout-cover{background:#171717;color:#f4f2eb}.slide.layout-metrics{justify-content:flex-start}.slide h2{font-size:clamp(28px,4vw,58px);letter-spacing:-.07em;max-width:80%;margin:0 0 18px}.slide p{font-size:clamp(16px,2vw,25px);line-height:1.35;max-width:75%;color:var(--muted)}.layout-cover p{color:#d7ff45}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:25px}.metric{border-top:2px solid var(--ink);padding-top:12px}.metric b{font-size:38px;display:block;letter-spacing:-.07em}.metric span{color:var(--muted)}.refs{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:12px}.empty-stage{display:grid;place-items:center;min-height:420px;border:1px dashed var(--line);color:var(--muted);text-align:center;padding:30px}.notice{background:#fff0ca;border:1px solid #c5a954;padding:12px;margin-bottom:18px;font-size:12px;line-height:1.5}@media(max-width:850px){.app{grid-template-columns:1fr}.side{padding:20px}.presentation-list{display:flex;overflow:auto}.main{padding:24px 16px}.stage{grid-template-columns:1fr}.thumbs{display:flex;overflow:auto}.thumb{min-width:145px}.slide{min-height:300px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">deck<span>ai</span></div><div class="kicker">Apresentações locais</div><div id="presentationList" class="presentation-list"></div><a href="prototipo.html" style="display:block;color:#d7ff45;margin-top:30px;font-size:12px">← Voltar ao protótipo</a></aside><main class="main"><header class="top"><div><div class="kicker">Visualizador · fonte JSON</div><h1 id="presentationTitle" class="title">Selecione uma apresentação</h1></div><div id="meta" class="meta"></div></header><div id="notice" class="notice" style="display:none"></div><div class="toolbar"><button class="btn" onclick="previousVersion()">Versão anterior</button><button class="btn" onclick="nextVersion()">Próxima versão</button><button class="btn outline" onclick="toggleFullscreen()">Tela cheia</button><button class="btn outline" onclick="refresh()">Atualizar</button></div><section class="stage"><div id="thumbs" class="thumbs"></div><div id="stage"><div class="empty-stage">Crie uma apresentação no protótipo para visualizá-la aqui.</div></div></section></main></div><script>
const KEY='deckai.prototype.presentations';let presentations=[],selected=null,versionIndex=0,slideIndex=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{presentations=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{presentations=[]}if(!selected&&presentations[0])selected=presentations[0].presentationId;renderList();render()}function current(){return presentations.find(p=>p.presentationId===selected)}function version(){return current()?.versions?.[versionIndex]}function renderList(){const e=document.getElementById('presentationList');e.innerHTML=presentations.length?presentations.map(p=>`<button class="${p.presentationId===selected?'active':''}" onclick="selectPresentation('${p.presentationId}')">${esc(p.title)}<br><small>${p.versions.length} versão(ões)</small></button>`).join(''):'<div class="empty">Nenhuma apresentação salva.<br>Crie uma no protótipo.</div>'}function selectPresentation(id){selected=id;versionIndex=0;slideIndex=0;renderList();render()}function render(){const p=current(),v=version();if(!p||!v){document.getElementById('presentationTitle').textContent='Selecione uma apresentação';document.getElementById('meta').textContent='';document.getElementById('thumbs').innerHTML='';document.getElementById('stage').innerHTML='<div class="empty-stage">Crie uma apresentação no protótipo para visualizá-la aqui.</div>';return}const c=v.content;const slides=c?.slides||[{slideId:'local-slide',layout:'cover',blocks:[{type:'text',role:'title',text:v.text}],references:[]}];document.getElementById('presentationTitle').textContent=p.title;document.getElementById('meta').textContent=`Versão ${v.versionNumber} · ${new Date(v.createdAt).toLocaleString('pt-BR')}`;document.getElementById('thumbs').innerHTML=slides.map((s,i)=>`<button class="thumb ${i===slideIndex?'active':''}" onclick="selectSlide(${i})"><div class="thumb-number">SLIDE ${i+1}</div><div class="thumb-title">${esc(slideTitle(s))}</div></button>`).join('');const s=slides[slideIndex]||slides[0];document.getElementById('stage').innerHTML=renderSlide(s,slideIndex);const notice=document.getElementById('notice');notice.style.display=c?'none':'block';notice.textContent='Esta apresentação foi criada pelo protótipo local e ainda não possui o JSON completo de layouts.'}function slideTitle(s){const b=s.blocks?.find(x=>x.role==='title')||s.blocks?.find(x=>x.text);return b?.text||s.layout||'Slide'}function renderSlide(s,i){const blocks=s.blocks||[];const title=slideTitle(s);const body=blocks.filter(b=>b.text&&b.text!==title).map(b=>`<p>${esc(b.text)}</p>`).join('');const metrics=blocks.filter(b=>b.type==='metric').map(b=>`<div class="metric"><b>${esc(b.value)}</b><span>${esc(b.label)} ${esc(b.unit)}</span></div>`).join('');return `<article class="slide layout-${esc(s.layout)}"><div class="kicker">${esc(s.layout)} · slide ${i+1}</div><h2>${esc(title)}</h2>${body}${metrics?`<div class="metrics">${metrics}</div>`:''}${s.references?.length?`<div class="refs">Referências: ${s.references.map(esc).join(', ')}</div>`:'<div class="refs">Sem referências vinculadas</div>'}</article>`}function selectSlide(i){slideIndex=i;render()}function previousVersion(){if(versionIndex<((current()?.versions?.length||1)-1)){versionIndex++;slideIndex=0;render()}}function nextVersion(){if(versionIndex>0){versionIndex--;slideIndex=0;render()}}function toggleFullscreen(){document.querySelector('.slide')?.requestFullscreen?.()}function refresh(){load()}load();
</script></body></html>
