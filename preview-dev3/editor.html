<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deck AI · Editor local</title>
<style>
:root{--ink:#171717;--paper:#f1f0eb;--card:#fbfbf8;--acid:#d7ff45;--muted:#77766f;--line:#d8d7d0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Arial,sans-serif}.page{max-width:1050px;margin:auto;padding:34px}.top{border-bottom:1px solid var(--ink);padding-bottom:20px;margin-bottom:20px}.kicker{text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-size:10px}h1{font-size:40px;letter-spacing:-.07em;margin:8px 0}.notice{background:#fff0ca;border:1px solid #c5a954;padding:12px;font-size:12px;line-height:1.5;margin-bottom:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.btn{border:1px solid var(--ink);background:var(--ink);color:var(--acid);padding:10px 13px;cursor:pointer}.outline{background:transparent;color:var(--ink)}.grid{display:grid;grid-template-columns:260px 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);padding:19px}.card h2{margin:0 0 14px;font-size:18px}.list{display:grid;gap:5px}.list button{background:transparent;border:0;border-left:2px solid transparent;text-align:left;padding:11px;cursor:pointer}.list button.active,.list button:hover{border-left-color:var(--ink);background:var(--acid)}.field{display:grid;gap:6px;margin:13px 0}.field label{text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:10px}input,textarea,select{font:inherit;border:1px solid var(--line);background:#fff;padding:11px;width:100%}textarea{min-height:160px;resize:vertical}.slidebar{border-top:1px solid var(--line);padding-top:14px;margin-top:18px}.history{display:grid;gap:8px}.version{border:1px solid var(--line);padding:10px;font-size:12px;cursor:pointer}.version.active{border-color:var(--ink);background:#f0efdc}.muted{color:var(--muted);font-size:12px}@media(max-width:750px){.page{padding:20px}.grid{grid-template-columns:1fr}}
</style></head><body><main class="page"><header class="top"><div class="kicker">Deck AI · edição local</div><h1>Editar apresentação</h1><div class="muted">Cada salvamento cria uma nova versão. O histórico anterior permanece intacto.</div></header><div id="notice" class="notice">Selecione uma apresentação para começar.</div><div class="toolbar"><button class="btn" onclick="saveVersion()">Salvar nova versão</button><button class="btn outline" onclick="duplicate()">Duplicar apresentação</button><button class="btn outline" onclick="window.location.href='apresentacao.html'">Abrir visualizador</button><button class="btn outline" onclick="load()">Atualizar</button></div><section class="grid"><aside class="card"><h2>Apresentações</h2><div id="list" class="list"></div></aside><section class="card"><h2 id="selectedName">Nenhuma selecionada</h2><div class="field"><label>Título</label><input id="title"></div><div class="field"><label>Texto do primeiro slide</label><textarea id="body"></textarea></div><div class="slidebar"><h2>Histórico</h2><div id="history" class="history"></div></div></section></section></main><script>
const KEY='deckai.prototype.presentations';let data=[],selected=null,selectedVersion=0;const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}};const write=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function load(){data=read();if(!selected&&data[0])selected=data[0].presentationId;render()}function current(){return data.find(p=>p.presentationId===selected)}function version(){return current()?.versions?.[selectedVersion]}function render(){const list=document.getElementById('list');list.innerHTML=data.length?data.map(p=>`<button class="${p.presentationId===selected?'active':''}" onclick="choose('${p.presentationId}')">${esc(p.title)}<br><span class="muted">${p.versions.length} versão(ões)</span></button>`).join(''):'<div class="muted">Nenhuma apresentação. Crie uma no protótipo.</div>';const p=current(),v=version();if(!p||!v)return;document.getElementById('selectedName').textContent=p.title;document.getElementById('title').value=p.title;document.getElementById('body').value=v.text||v.content?.slides?.[0]?.blocks?.find(b=>b.text)?.text||'';document.getElementById('history').innerHTML=p.versions.map((x,i)=>`<div class="version ${i===selectedVersion?'active':''}" onclick="selectVersion(${i})"><b>Versão ${x.versionNumber}</b><br><span class="muted">${new Date(x.createdAt).toLocaleString('pt-BR')}</span></div>`).join('');document.getElementById('notice').textContent=`Editando “${p.title}”. As alterações serão salvas como nova versão.`}function choose(id){selected=id;selectedVersion=0;render()}function selectVersion(i){selectedVersion=i;render()}function saveVersion(){const p=current();if(!p)return alert('Selecione uma apresentação.');const title=document.getElementById('title').value.trim(),body=document.getElementById('body').value.trim();if(!title||!body)return alert('Título e texto são obrigatórios.');p.title=title;p.versions.push({versionId:'ver_'+crypto.randomUUID(),versionNumber:p.versions.length+1,createdAt:new Date().toISOString(),source:'local_editor',text:body});selectedVersion=p.versions.length-1;write();render();alert('Nova versão salva.')}function duplicate(){const p=current();if(!p)return alert('Selecione uma apresentação.');const copy=JSON.parse(JSON.stringify(p));copy.presentationId='pres_'+crypto.randomUUID();copy.title=p.title+' — cópia';copy.versions=copy.versions.map(v=>({...v,versionId:'ver_'+crypto.randomUUID()}));data.push(copy);selected=copy.presentationId;selectedVersion=0;write();render();alert('Apresentação duplicada.')}load();
</script></body></html>
